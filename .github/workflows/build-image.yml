name: Build bootc image

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-bootc-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            createrepo-c podman python3-yaml qemu-system-x86 rpm skopeo

      - name: Build bootc container and qcow2 disk
        run: sudo python3 ibbootc.py build --image-builder-container

      - name: Boot qcow2 before publishing
        run: |
          set -euo pipefail
          shopt -s nullglob
          disks=(work/qcow2/*.qcow2)
          if (( ${#disks[@]} != 1 )); then
            echo "Expected one qcow2 disk under work/qcow2; found ${#disks[@]}" >&2
            exit 1
          fi

          disk="${disks[0]}"
          sudo chmod a+r "$disk"
          qemu_tmpdir="$(mktemp -d /tmp/ibbootc-qemu.XXXXXX)"
          boot_log="$qemu_tmpdir/serial.log"
          touch "$boot_log"
          TMPDIR="$qemu_tmpdir" qemu-system-x86_64 \
            -snapshot \
            -machine q35 \
            -accel tcg,thread=multi \
            -m 3072 \
            -smp 2 \
            -display none \
            -serial "file:$boot_log" \
            -monitor none \
            -no-reboot \
            -drive "file=$disk,format=qcow2,if=virtio" &
          qemu_pid=$!
          cleanup() {
            kill "$qemu_pid" 2>/dev/null || true
            wait "$qemu_pid" 2>/dev/null || true
            rm -rf "$qemu_tmpdir"
          }
          trap cleanup EXIT

          deadline=$((SECONDS + 300))
          until grep -Fq 'login:' "$boot_log"; do
            if ! kill -0 "$qemu_pid" 2>/dev/null; then
              tail -n 120 "$boot_log"
              echo "QEMU exited before the guest reached its serial login prompt" >&2
              exit 1
            fi
            if (( SECONDS >= deadline )); then
              tail -n 120 "$boot_log"
              echo "Guest did not reach its serial login prompt within 300 seconds" >&2
              exit 1
            fi
            sleep 1
          done
          tail -n 40 "$boot_log"
          echo "Guest reached its serial login prompt"

      - name: Set GHCR image tags
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            echo "latest_tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: 1.3.3

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GITHUB_TOKEN" | sudo podman login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin
          printf '%s' "$GITHUB_TOKEN" | oras login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin

      - name: Push bootc container image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          SHA_TAG: ${{ steps.image.outputs.sha_tag }}
          LATEST_TAG: ${{ steps.image.outputs.latest_tag }}
        run: |
          set -euo pipefail
          sudo podman tag localhost/ibbootc:poc "$IMAGE:$SHA_TAG"
          sudo podman push --format oci "$IMAGE:$SHA_TAG"
          if [[ -n "$LATEST_TAG" ]]; then
            sudo podman tag localhost/ibbootc:poc "$IMAGE:$LATEST_TAG"
            sudo podman push --format oci "$IMAGE:$LATEST_TAG"
          fi

      - name: Attach qcow2 disk to the image in GHCR
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          SHA_TAG: ${{ steps.image.outputs.sha_tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          disks=(work/qcow2/*.qcow2)
          if (( ${#disks[@]} != 1 )); then
            echo "Expected one qcow2 disk under work/qcow2; found ${#disks[@]}" >&2
            exit 1
          fi
          oras attach \
            --artifact-type application/vnd.ibbootc.disk.v1 \
            --annotation "org.opencontainers.image.title=$(basename "${disks[0]}")" \
            "$IMAGE:$SHA_TAG" \
            "${disks[0]}:application/vnd.qemu.qcow2"
